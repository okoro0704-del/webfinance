# Supabase local development config — Project 3 Master Distributor Control Panel
# https://supabase.com/docs/guides/cli/config

project_id = "webfinance-distributor-cp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Analytics (Logflare) is heavy on first boot; exclude locally if needed:
# npx supabase start --exclude logflare

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.provision-client]
verify_jwt = true

[functions.attach-domain]
verify_jwt = true

[functions.allocate-credits]
verify_jwt = true

[functions.set-client-status]
verify_jwt = true
